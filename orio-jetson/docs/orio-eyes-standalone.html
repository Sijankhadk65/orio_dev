<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orio · Face FSM</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080c; }
  a { color: #4ddbff; text-decoration: none; }
  a:hover { color: #ffd24d; }
</style>
</head>
<body>
<div style="min-height: 100vh; background: #08080c; color: #8e97b8; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center;">

  <div style="width: 100%; max-width: 1040px; display: flex; align-items: baseline; justify-content: space-between;">
    <div id="title" style="font-size: 15px; font-weight: 600; color: #4ddbff; letter-spacing: .5px;">Orio · Face FSM</div>
    <div id="readout" style="font-size: 14px; color: #59617e;">IDLE</div>
  </div>

  <div style="width: 100%; max-width: 1040px; background: #07070b; border: 1px solid #1b1d29; border-radius: 12px; overflow: hidden;">
    <canvas id="eyes" width="2048" height="1152" style="display: block; width: 100%; height: auto;"></canvas>
  </div>

  <div id="chips" style="width: 100%; max-width: 1040px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;"></div>

  <div style="width: 100%; max-width: 1040px; font-size: 13px; color: #4a5170;">Keys 1–6 · O toggles outlined style · C toggles per-state colors · shape-only expression, no pupils · mouth per state · window.orioEyes.setState('THINKING')</div>
</div>

<script>
// ORIO eye FSM — standalone. Shape-only: every expression is width / height / radius / slant / offset.
// Geometry is authored in a 128x72 unit space and drawn smooth at the canvas's real resolution.
// The mouth is the same idea: one stroke whose width / opening / curve / tilt / zigzag morph per state.
const HUE = {
  ASLEEP:    { main: '#2f7fb5' },
  IDLE:      { main: '#4ddbff' },
  LISTENING: { main: '#5cffc0' },
  THINKING:  { main: '#b57bff' },
  SPEAKING:  { main: '#ffd24d' },
  ERROR:     { main: '#ff4d4d' }
};

const STATES = [
  { name: 'ASLEEP',    key: '1', note: 'flat bars · slow breath · tiny o' },
  { name: 'IDLE',      key: '2', note: 'tall blobs · sway + blink · smile' },
  { name: 'LISTENING', key: '3', note: 'taller · level pulse · ooh' },
  { name: 'THINKING',  key: '4', note: 'small · slanted · drifting up · hmm' },
  { name: 'SPEAKING',  key: '5', note: 'syllable bounce · talking' },
  { name: 'ERROR',     key: '6', note: 'angry slant · jitter · zigzag' }
];

// face styles — variations on the same geometry/motion (mirrors _STYLES in orio/eyes.py).
// eyeBorder = ring thickness in units (0 = none), scaled by the state's dim like the eyes.
const STYLES = {
  plain:    { eyeBorder: 0,   eyeBorderColor: [255, 255, 255] },
  outlined: { eyeBorder: 1.5, eyeBorderColor: [255, 255, 255] }
};

const lerp = (a, b, k) => a + (b - a) * k;
const hex2rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgbStr = (c, a) => 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + (a === undefined ? 1 : a) + ')';

class OrioEyes {
  constructor(canvas) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.t0 = performance.now();
    this.stateName = 'IDLE';
    this.enterT = 0;
    this.mic = 0;
    this.nextBlink = 2.4; this.blinkStart = -1; this.winkStart = -1; this.winkEye = 0;
    this.g = { w: 26, h: 30, r: 9, dx: 0, dy: 0, skew: 0, dim: 1, mw: 14, mopen: 0, mcurve: 3, mtilt: 0, mzig: 0, mdx: 0 };
    this.col = hex2rgb(HUE.IDLE.main);
    this.style = 'plain';
    this.fixedColor = '#4ddbff';   // one color for every state; null = color by state (HUE)
    this.onChange = null;
    this.raf = requestAnimationFrame(this.loop);
  }

  now() { return (performance.now() - this.t0) / 1000; }

  setState(name) {
    if (!HUE[name] || name === this.stateName) return;
    this.stateName = name;
    this.enterT = this.now();
    this.nextBlink = this.now() + 2.2;
    if (this.onChange) this.onChange(name);
  }

  destroy() { cancelAnimationFrame(this.raf); }

  // target geometry per state — the whole animation vocabulary lives here.
  // Eye keys: w h r dx dy skew dim. Mouth keys (m*): mw = width, mopen = how far
  // the lips part at the middle, mcurve = smile (+) / frown (-) depth, mtilt =
  // right-side-up (+) slant, mzig = zigzag amplitude, mdx = sideways offset.
  targets(st, t) {
    const age = t - this.enterT;
    const pop = Math.exp(-age * 4.5) * Math.sin(age * 15);   // settle overshoot
    switch (st) {
      case 'ASLEEP':
        return { w: 28, h: 5 + Math.sin(t * 1.15) * 1.6, r: 2.5, dx: 0, dy: 7 + Math.sin(t * 1.15) * 1.2, skew: 0.06, dim: 0.55,
                 mw: 6, mopen: 1.5 + Math.sin(t * 1.15) * 1.2, mcurve: 0, mtilt: 0, mzig: 0, mdx: 0 };
      case 'IDLE': {
        const s = this.sway(t);
        return { w: 26, h: 30 + pop * 5, r: 9, dx: s.x, dy: s.y + Math.sin(t * 1.5) * 1.1, skew: 0, dim: 1,
                 mw: 14, mopen: 0, mcurve: 3 + pop, mtilt: 0, mzig: 0, mdx: 0 };
      }
      case 'LISTENING':
        return { w: 27 + this.mic * 1.5, h: 34 + this.mic * 4 + pop * 5, r: 10, dx: Math.sin(t * 0.8) * 1.6, dy: -1 - this.mic, skew: -0.05, dim: 1,
                 mw: 7, mopen: 4 + pop, mcurve: 0, mtilt: 0, mzig: 0, mdx: 0 };
      case 'THINKING':
        return { w: 22, h: 19, r: 8, dx: -3 + Math.cos(t * 1.5) * 2.2, dy: -5 + Math.sin(t * 1.5) * 1.4, skew: 0.3, dim: 1,
                 mw: 10, mopen: 0, mcurve: -0.5, mtilt: 2 + Math.sin(t * 1.5) * 0.5, mzig: 0, mdx: 6 };
      case 'SPEAKING': {
        const env = Math.sin(t * 8.5) * 0.6 + Math.sin(t * 4.1) * 0.4;
        return { w: 26 - env * 1.2, h: 26 + env * 6, r: 9, dx: 0, dy: -env * 1.6, skew: -0.05, dim: 1,
                 mw: 13 - env * 1.5, mopen: 3.5 + env * 3, mcurve: 1, mtilt: 0, mzig: 0, mdx: 0 };
      }
      case 'ERROR':
        return { w: 28, h: 11 + pop * 4, r: 3, dx: 0, dy: 1, skew: 0.55, dim: 1,
                 mw: 18, mopen: 0, mcurve: -1, mtilt: 0, mzig: 1.5, mdx: 0 };
      default:
        return { w: 26, h: 30, r: 9, dx: 0, dy: 0, skew: 0, dim: 1,
                 mw: 14, mopen: 0, mcurve: 3, mtilt: 0, mzig: 0, mdx: 0 };
    }
  }

  sway(t) {
    const seed = Math.floor(t / 2.6);
    const r = (n) => Math.abs((Math.sin(n * 12.9898) * 43758.5453) % 1);
    const k = Math.min(1, (t % 2.6) / 0.5), e = k * k * (3 - 2 * k);
    const a = [r(seed) * 6 - 3, r(seed + 5) * 4 - 2];
    const b = [r(seed + 1) * 6 - 3, r(seed + 6) * 4 - 2];
    return { x: lerp(a[0], b[0], e), y: lerp(a[1], b[1], e) };
  }

  loop = () => {
    this.draw(this.now());
    this.raf = requestAnimationFrame(this.loop);
  };

  // rounded rect with per-row horizontal slant, in canvas pixels (skew is a per-row ratio, so scale-free)
  blob(cx, cy, w, h, r, skew, color) {
    const ctx = this.ctx;
    w = Math.max(2, Math.round(w)); h = Math.max(1, Math.round(h));
    r = Math.max(0, Math.min(r, h / 2, w / 2));
    const x0 = Math.round(cx - w / 2), y0 = Math.round(cy - h / 2);
    ctx.fillStyle = color;
    for (let row = 0; row < h; row++) {
      const d = Math.min(row, h - 1 - row);
      let inset = 0;
      if (d < r) inset = Math.round(r - Math.sqrt(Math.max(0, r * r - (r - d - 0.5) * (r - d - 0.5))));
      const off = Math.round(skew * (row - (h - 1) / 2));
      ctx.fillRect(x0 + inset + off, y0 + row, w - inset * 2, 1);
    }
  }

  // mouth: a 2-unit stroke bent by curve / tilt / zigzag and parted into a lens by `open`
  // (widest at the middle, closed at the corners), thinning along a circle into round corners.
  // cx/cy are canvas pixels, shape args are units, s = pixels per unit.
  mouth(s, cx, cy, w, open, curve, tilt, zig, color) {
    const ctx = this.ctx;
    w = Math.max(2, Math.round(w * s));
    const x0 = Math.round(cx - w / 2);
    ctx.fillStyle = color;
    let prev = null;
    for (let col = 0; col < w; col++) {
      const u = (col + 0.5) / w * 2 - 1;                     // -1 left corner … +1 right corner
      const ph = ((col / s) % 6) / 6, tri = Math.abs(ph * 4 - 2) - 1;
      const yc = cy + (curve * (0.5 - u * u) - tilt * u + zig * tri) * s;
      const half = Math.max(0, open) / 2 * Math.sqrt(Math.max(0, 1 - u * u)) * s;
      // span back to the previous column's centre too, so steep slopes stay one unbroken stroke
      const lo = prev === null ? yc : Math.min(yc, prev), hi = prev === null ? yc : Math.max(yc, prev);
      const d = Math.min(col, w - 1 - col) + 0.5;              // px from the nearest corner
      const stroke = d < s ? Math.sqrt(Math.max(0, s * s - (s - d) * (s - d))) : s;
      const top = Math.round(lo - stroke - half), bot = Math.round(hi + stroke + half);
      ctx.fillRect(x0 + col, top, 1, Math.max(1, bot - top));
      prev = yc;
    }
  }

  draw(t) {
    const ctx = this.ctx;
    const W = this.cv.width, H = this.cv.height;
    const st = this.stateName;
    const tg = this.targets(st, t);
    const g = this.g, k = 0.16;

    for (const key in g) g[key] = lerp(g[key], tg[key], k);
    this.mic = lerp(this.mic, st === 'LISTENING' ? Math.abs(Math.sin(t * 3.1) * 0.6 + Math.sin(t * 7.9) * 0.4) : 0, 0.18);

    const target = hex2rgb(this.fixedColor || (HUE[st] || HUE.IDLE).main);
    for (let i = 0; i < 3; i++) this.col[i] = lerp(this.col[i], target[i], 0.1);

    // blinks + occasional wink (idle family only)
    if ((st === 'IDLE' || st === 'LISTENING' || st === 'SPEAKING') && t > this.nextBlink) {
      this.blinkStart = t; this.nextBlink = t + 2.6 + Math.random() * 3.6;
    }
    let blink = 1;
    if (this.blinkStart > 0) {
      const b = (t - this.blinkStart) / 0.13;
      if (b < 2) blink = Math.max(0.04, Math.abs(b - 1));
      else { this.blinkStart = -1; if (st === 'IDLE' && Math.random() < 0.28) { this.winkStart = t; this.winkEye = Math.random() < 0.5 ? 0 : 1; } }
    }
    let wink = 1, winkEye = -1;
    if (this.winkStart > 0) {
      const b = (t - this.winkStart) / 0.2;
      if (b < 2) { wink = Math.max(0.05, Math.abs(b - 1)); winkEye = this.winkEye; } else this.winkStart = -1;
    }

    ctx.fillStyle = '#07070b';
    ctx.fillRect(0, 0, W, H);

    // unit space -> canvas pixels: uniform scale to fit, centred
    const s = Math.min(W / 128, H / 72);
    const px = (ux) => W / 2 + ux * s, py = (uy) => H / 2 + uy * s;

    // eyes sit a little above centre to leave room for the mouth below
    const eyeY = -5, gapHalf = 20;
    const jitter = st === 'ERROR' && Math.random() < 0.22 ? Math.round(Math.random() * 3 - 1.5) : 0;
    const color = rgbStr(this.col, g.dim);
    const sty = STYLES[this.style] || STYLES.plain, border = sty.eyeBorder;
    const borderColor = rgbStr(sty.eyeBorderColor.map(c => c * g.dim));

    for (let i = 0; i < 2; i++) {
      const lid = blink * (i === winkEye ? wink : 1);
      const h = Math.max(2, g.h * lid);
      const skew = g.skew * (i === 0 ? 1 : -1);
      const cx = px((i === 0 ? -gapHalf : gapHalf) + g.dx + jitter), cy = py(eyeY + g.dy);
      // ring: the same blob grown by `border` on every side, with the eye drawn on top
      if (border > 0) this.blob(cx, cy, (g.w + 2 * border) * s, (h + 2 * border) * s, (g.r + border) * s, skew, borderColor);
      this.blob(cx, cy, g.w * s, h * s, g.r * s, skew, color);
    }

    // mouth follows the eyes at reduced parallax, so the face moves as one but reads as having depth
    this.mouth(s, px(g.dx * 0.6 + g.mdx + jitter), py(21 + g.dy * 0.4),
               g.mw, g.mopen, g.mcurve, g.mtilt, g.mzig, color);
  }
}

// --- demo chrome (delete this block to embed the eyes bare) ---
const canvas = document.getElementById('eyes');
const eyes = new OrioEyes(canvas);
window.orioEyes = eyes;

const chips = document.getElementById('chips');
const buttons = STATES.map(s => {
  const b = document.createElement('button');
  b.style.cssText = "cursor:pointer;appearance:none;font-family:inherit;font-size:12px;font-weight:600;padding:12px 10px;text-align:left;border:1px solid #242739;border-radius:8px;background:transparent;color:" + HUE[s.name].main + ";";
  b.innerHTML = '<div style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:' + HUE[s.name].main + ';display:inline-block;"></span><span>' + s.key + '</span></div><div style="margin-top:8px;">' + s.name + '</div>';
  b.addEventListener('click', () => eyes.setState(s.name));
  chips.appendChild(b);
  return b;
});

function paintUI(name) {
  const h = HUE[name].main;
  document.getElementById('title').style.color = h;
  document.getElementById('readout').textContent = name + ' · ' + STATES.find(s => s.name === name).note;
  buttons.forEach((b, i) => {
    const on = STATES[i].name === name;
    b.style.background = on ? 'rgba(255,255,255,.07)' : 'transparent';
    b.style.color = on ? '#ffffff' : HUE[STATES[i].name].main;
    b.style.borderColor = on ? HUE[STATES[i].name].main : '#242739';
  });
}
eyes.onChange = paintUI;
paintUI('IDLE');

window.addEventListener('keydown', e => {
  const s = STATES.find(s => s.key === e.key);
  if (s) eyes.setState(s.name);
  if (e.key === 'o' || e.key === 'O') eyes.style = eyes.style === 'plain' ? 'outlined' : 'plain';
  if (e.key === 'c' || e.key === 'C') eyes.fixedColor = eyes.fixedColor ? null : '#4ddbff';
});
</script>
</body>
</html>
