<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORIO · Eye FSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #08080c; }
  a { color: #4ddbff; text-decoration: none; }
  a:hover { color: #ffd24d; }
  @keyframes scanDrift { from { transform: translateY(0) } to { transform: translateY(6px) } }
  @keyframes crtFlicker { 0%,100% { opacity: .98 } 46% { opacity: .94 } 47% { opacity: 1 } 74% { opacity: .95 } }
</style>
</head>
<body>
<div style="min-height: 100vh; background: #08080c; color: #8e97b8; font-family: 'VT323', monospace; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center;">

  <div style="width: 100%; max-width: 1040px; display: flex; align-items: baseline; justify-content: space-between;">
    <div id="title" style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #4ddbff; letter-spacing: 1px;">ORIO · EYE FSM</div>
    <div id="readout" style="font-size: 19px; letter-spacing: 2px; color: #59617e;">IDLE</div>
  </div>

  <div style="width: 100%; max-width: 1040px; position: relative; background: #0a0a0e; border: 1px solid #1b1d29; overflow: hidden;">
    <canvas id="eyes" width="128" height="72" style="display: block; width: 100%; height: auto; image-rendering: pixelated; transition: filter .3s linear; animation: crtFlicker 5s steps(1) infinite;"></canvas>
    <div style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.30) 0px, rgba(0,0,0,.30) 2px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 6px); animation: scanDrift 1.6s linear infinite;"></div>
    <div style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to right, rgba(255,0,80,.03) 0px, rgba(255,0,80,.03) 2px, rgba(0,255,160,.03) 2px, rgba(0,255,160,.03) 4px, rgba(60,120,255,.03) 4px, rgba(60,120,255,.03) 6px);"></div>
    <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,.6) 100%);"></div>
  </div>

  <div id="chips" style="width: 100%; max-width: 1040px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;"></div>

  <div style="width: 100%; max-width: 1040px; font-size: 18px; color: #4a5170; letter-spacing: 1px;">KEYS 1-6 · SHAPE-ONLY EXPRESSION, NO PUPILS · window.orioEyes.setState('THINKING')</div>
</div>

<script>
// ORIO eye FSM — standalone. Shape-only: every expression is width / height / radius / slant / offset.
const HUE = {
  ASLEEP:    { main: '#2f7fb5' },
  IDLE:      { main: '#4ddbff' },
  LISTENING: { main: '#5cffc0' },
  THINKING:  { main: '#b57bff' },
  SPEAKING:  { main: '#ffd24d' },
  ERROR:     { main: '#ff4d4d' }
};

const STATES = [
  { name: 'ASLEEP',    key: '1', note: 'flat bars · slow breath' },
  { name: 'IDLE',      key: '2', note: 'tall blobs · sway + blink' },
  { name: 'LISTENING', key: '3', note: 'taller · level pulse' },
  { name: 'THINKING',  key: '4', note: 'small · slanted · drifting up' },
  { name: 'SPEAKING',  key: '5', note: 'syllable bounce' },
  { name: 'ERROR',     key: '6', note: 'angry slant · jitter' }
];

const lerp = (a, b, k) => a + (b - a) * k;
const hex2rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgbStr = (c, a) => 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + (a === undefined ? 1 : a) + ')';

class OrioEyes {
  constructor(canvas) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.t0 = performance.now();
    this.stateName = 'IDLE';
    this.enterT = 0;
    this.mic = 0;
    this.nextBlink = 2.4; this.blinkStart = -1; this.winkStart = -1; this.winkEye = 0;
    this.g = { w: 26, h: 30, r: 9, dx: 0, dy: 0, skew: 0, dim: 1 };
    this.col = hex2rgb(HUE.IDLE.main);
    this.onChange = null;
    this.raf = requestAnimationFrame(this.loop);
  }

  now() { return (performance.now() - this.t0) / 1000; }

  setState(name) {
    if (!HUE[name] || name === this.stateName) return;
    this.stateName = name;
    this.enterT = this.now();
    this.nextBlink = this.now() + 2.2;
    if (this.onChange) this.onChange(name);
  }

  destroy() { cancelAnimationFrame(this.raf); }

  // target geometry per state — the whole animation vocabulary lives here
  targets(st, t) {
    const age = t - this.enterT;
    const pop = Math.exp(-age * 4.5) * Math.sin(age * 15);   // settle overshoot
    switch (st) {
      case 'ASLEEP':
        return { w: 28, h: 5 + Math.sin(t * 1.15) * 1.6, r: 2.5, dx: 0, dy: 7 + Math.sin(t * 1.15) * 1.2, skew: 0.06, dim: 0.55 };
      case 'IDLE': {
        const s = this.sway(t);
        return { w: 26, h: 30 + pop * 5, r: 9, dx: s.x, dy: s.y + Math.sin(t * 1.5) * 1.1, skew: 0, dim: 1 };
      }
      case 'LISTENING':
        return { w: 27 + this.mic * 1.5, h: 34 + this.mic * 4 + pop * 5, r: 10, dx: Math.sin(t * 0.8) * 1.6, dy: -1 - this.mic, skew: -0.05, dim: 1 };
      case 'THINKING':
        return { w: 22, h: 19, r: 8, dx: -3 + Math.cos(t * 1.5) * 2.2, dy: -5 + Math.sin(t * 1.5) * 1.4, skew: 0.3, dim: 1 };
      case 'SPEAKING': {
        const env = Math.sin(t * 8.5) * 0.6 + Math.sin(t * 4.1) * 0.4;
        return { w: 26 - env * 1.2, h: 26 + env * 6, r: 9, dx: 0, dy: -env * 1.6, skew: -0.05, dim: 1 };
      }
      case 'ERROR':
        return { w: 28, h: 11 + pop * 4, r: 3, dx: 0, dy: 1, skew: 0.55, dim: 1 };
      default:
        return { w: 26, h: 30, r: 9, dx: 0, dy: 0, skew: 0, dim: 1 };
    }
  }

  sway(t) {
    const seed = Math.floor(t / 2.6);
    const r = (n) => Math.abs((Math.sin(n * 12.9898) * 43758.5453) % 1);
    const k = Math.min(1, (t % 2.6) / 0.5), e = k * k * (3 - 2 * k);
    const a = [r(seed) * 6 - 3, r(seed + 5) * 4 - 2];
    const b = [r(seed + 1) * 6 - 3, r(seed + 6) * 4 - 2];
    return { x: lerp(a[0], b[0], e), y: lerp(a[1], b[1], e) };
  }

  loop = () => {
    this.draw(this.now());
    this.raf = requestAnimationFrame(this.loop);
  };

  // pixel rounded rect with per-row horizontal slant
  blob(cx, cy, w, h, r, skew, color) {
    const ctx = this.ctx;
    w = Math.max(2, Math.round(w)); h = Math.max(1, Math.round(h));
    r = Math.max(0, Math.min(r, h / 2, w / 2));
    const x0 = Math.round(cx - w / 2), y0 = Math.round(cy - h / 2);
    ctx.fillStyle = color;
    for (let row = 0; row < h; row++) {
      const d = Math.min(row, h - 1 - row);
      let inset = 0;
      if (d < r) inset = Math.round(r - Math.sqrt(Math.max(0, r * r - (r - d - 0.5) * (r - d - 0.5))));
      const off = Math.round(skew * (row - (h - 1) / 2));
      ctx.fillRect(x0 + inset + off, y0 + row, w - inset * 2, 1);
    }
  }

  draw(t) {
    const ctx = this.ctx;
    const W = this.cv.width, H = this.cv.height;
    const st = this.stateName;
    const tg = this.targets(st, t);
    const g = this.g, k = 0.16;

    for (const key of ['w', 'h', 'r', 'dx', 'dy', 'skew', 'dim']) g[key] = lerp(g[key], tg[key], k);
    this.mic = lerp(this.mic, st === 'LISTENING' ? Math.abs(Math.sin(t * 3.1) * 0.6 + Math.sin(t * 7.9) * 0.4) : 0, 0.18);

    const target = hex2rgb((HUE[st] || HUE.IDLE).main);
    for (let i = 0; i < 3; i++) this.col[i] = lerp(this.col[i], target[i], 0.1);

    // blinks + occasional wink (idle family only)
    if ((st === 'IDLE' || st === 'LISTENING' || st === 'SPEAKING') && t > this.nextBlink) {
      this.blinkStart = t; this.nextBlink = t + 2.6 + Math.random() * 3.6;
    }
    let blink = 1;
    if (this.blinkStart > 0) {
      const b = (t - this.blinkStart) / 0.13;
      if (b < 2) blink = Math.max(0.04, Math.abs(b - 1));
      else { this.blinkStart = -1; if (st === 'IDLE' && Math.random() < 0.28) { this.winkStart = t; this.winkEye = Math.random() < 0.5 ? 0 : 1; } }
    }
    let wink = 1, winkEye = -1;
    if (this.winkStart > 0) {
      const b = (t - this.winkStart) / 0.2;
      if (b < 2) { wink = Math.max(0.05, Math.abs(b - 1)); winkEye = this.winkEye; } else this.winkStart = -1;
    }

    ctx.fillStyle = '#07070b';
    ctx.fillRect(0, 0, W, H);

    const cy = H / 2, gapHalf = 20;
    const jitter = st === 'ERROR' && Math.random() < 0.22 ? Math.round(Math.random() * 3 - 1.5) : 0;

    for (let i = 0; i < 2; i++) {
      const lid = blink * (i === winkEye ? wink : 1);
      const h = Math.max(2, g.h * lid);
      const cx = (i === 0 ? -gapHalf : gapHalf) + W / 2 + g.dx + jitter;
      const skew = g.skew * (i === 0 ? 1 : -1);
      // single crisp silhouette — the phosphor glow is a CSS drop-shadow on the canvas
      this.blob(cx, cy + g.dy, g.w, h, g.r, skew, rgbStr(this.col, g.dim));
      // top-left specular pixel — retro shine, keeps blobs from reading flat
      if (h > 8 && g.dim > 0.7) {
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        const sx = Math.round(cx - g.w / 2 + g.r * 0.8 + skew * h / 3);
        ctx.fillRect(sx, Math.round(cy + g.dy - h / 2 + 3), 2, 2);
      }
    }

    if (st === 'ERROR' && Math.random() < 0.3) {
      const y = Math.floor(Math.random() * (H - 10)), hh = 4 + Math.floor(Math.random() * 6);
      const slice = ctx.getImageData(0, y, W, hh);
      ctx.fillStyle = '#07070b'; ctx.fillRect(0, y, W, hh);
      ctx.putImageData(slice, Math.round(Math.random() * 10 - 5), y);
    }
  }
}

// --- demo chrome (delete this block to embed the eyes bare) ---
const canvas = document.getElementById('eyes');
const eyes = new OrioEyes(canvas);
window.orioEyes = eyes;

const chips = document.getElementById('chips');
const buttons = STATES.map(s => {
  const b = document.createElement('button');
  b.style.cssText = "cursor:pointer;appearance:none;font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.5px;padding:12px 8px;text-align:left;border:1px solid #242739;background:transparent;color:" + HUE[s.name].main + ";";
  b.innerHTML = '<div style="display:flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;background:' + HUE[s.name].main + ';display:inline-block;"></span><span>' + s.key + '</span></div><div style="margin-top:8px;">' + s.name + '</div>';
  b.addEventListener('click', () => eyes.setState(s.name));
  chips.appendChild(b);
  return b;
});

function paintUI(name) {
  const h = HUE[name].main;
  document.getElementById('title').style.color = h;
  document.getElementById('readout').textContent = name + ' · ' + STATES.find(s => s.name === name).note;
  canvas.style.filter = 'drop-shadow(0 0 3px ' + h + '80) drop-shadow(0 0 9px ' + h + '55)';
  buttons.forEach((b, i) => {
    const on = STATES[i].name === name;
    b.style.background = on ? 'rgba(255,255,255,.07)' : 'transparent';
    b.style.color = on ? '#ffffff' : HUE[STATES[i].name].main;
    b.style.borderColor = on ? HUE[STATES[i].name].main : '#242739';
  });
}
eyes.onChange = paintUI;
paintUI('IDLE');

window.addEventListener('keydown', e => {
  const s = STATES.find(s => s.key === e.key);
  if (s) eyes.setState(s.name);
});
</script>
</body>
</html>
